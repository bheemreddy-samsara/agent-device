        p=pathlib.Path(os.environ['EVIDENCE']); adb=str(pathlib.Path(os.environ.get('ANDROID_SDK_ROOT',os.environ['ANDROID_HOME']))/'platform-tools/adb'); checks=[]
        def processes():
