         for f in pathlib.Path('/proc').glob('[0-9]*/cmdline'):
          try:
           args=f.read_bytes().split(b'\0'); name=pathlib.Path(args[0].decode(errors='replace')).name
           if name=='emulator' or name.startswith('qemu-system-'): found.append({'pid':int(f.parent.name),'argv':[a.decode(errors='replace') for a in args if a]})
          except (OSError,ValueError): pass
