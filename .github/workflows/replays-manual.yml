name: Replay Manual

# Parked here by #1781 A1. Both suites failed every scheduled run from 2026-07-24 on — the
# Android suite inside full-tier scenarios that had never executed end to end, the iOS suite
# on varying steps — so on a schedule they only produced noise. Manual dispatch keeps them
# runnable while they are being repaired; `pnpm check:gate-manifest` reports the checks they
# declare as manual-only (scripts/gate/declarations.ts) so the missing owner stays visible.
# Move these jobs back into replays-nightly.yml once a dispatch run is green.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-android:
    name: Android Full Emulator Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.tmp/android-e2e-state
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 3800feaefe6bf8627d7394c4495fbe8960ec8f40

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Android replay host
        id: android-replay-host
        uses: ./.github/actions/setup-android-replay-host
        with:
          package-helpers: 'true'

      - name: Restore Android fixture APK
        id: fixture-app
        uses: ./.github/actions/setup-fixture-app
        with:
          platform: android
          install: 'false'
          require-artifact: 'true'

      - name: Mark Android emulator setup complete
        id: android-setup
        run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare private Android launch-control probe
        run: |
          mkdir -p .tmp
          cat > .tmp/round21-android.sh <<'PROBE_SH'
          #!/bin/sh
          set -eu
          pnpm gate build
          pnpm clean:daemon
          python3 - <<'PROBE_PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          out = Path('test/artifacts/round21-android-launch-controls').resolve()
          out.mkdir(parents=True, exist_ok=True)
          wrapper_dir = Path('.tmp/round21-adb').resolve()
          wrapper_dir.mkdir(parents=True, exist_ok=True)
          real_adb = shutil.which('adb')
          assert real_adb, 'native adb must exist'
          wrapper = r"""#!/usr/bin/env python3
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          args = sys.argv[1:]
          out = Path(os.environ['ROUND21_PROBE_OUTPUT'])
          name = str(time.time_ns()) + '-' + str(os.getpid())
          (out / (name + '-argv.json')).write_text(json.dumps(args))
          selected = any('resolve-activity' in arg or ('am' in arg and 'start' in arg) for arg in args)
          if selected:
              result = subprocess.run([REAL_ADB, *args], capture_output=True)
              (out / (name + '-stdout.txt')).write_bytes(result.stdout)
              (out / (name + '-stderr.txt')).write_bytes(result.stderr)
              (out / (name + '-exit.txt')).write_text(str(result.returncode))
              sys.stdout.buffer.write(result.stdout)
              sys.stderr.buffer.write(result.stderr)
              sys.exit(result.returncode if result.returncode >= 0 else 128-result.returncode)
          os.execv(REAL_ADB, [REAL_ADB, *args])
          """.replace('REAL_ADB', repr(real_adb))
          (wrapper_dir / 'adb').write_text(wrapper)
          (wrapper_dir / 'adb').chmod(0o755)
          env = dict(os.environ, PATH=str(wrapper_dir)+os.pathsep+os.environ['PATH'], ROUND21_PROBE_OUTPUT=str(out))
          base = ['node', '--experimental-strip-types', 'src/bin.ts']
          flags = ['--platform', 'android', '--serial', os.environ['ANDROID_SERIAL'], '--session', 'round21-launch-controls', '--json']
          launch = ['-S', '-R', '1', '--display', '0']
          command = [*base, 'open', 'settings', *flags]
          for arg in launch:
              command += ['--launch-args', arg]
          (out / 'source.json').write_text(json.dumps(dict(head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),command=command,realAdb=real_adb,wrapper=str(wrapper_dir/'adb'),note='private argv/output observer; may perturb timings')))
          status = 1
          try:
              result = subprocess.run(command, env=env, capture_output=True)
              (out / 'open.stdout').write_bytes(result.stdout)
              (out / 'open.stderr').write_bytes(result.stderr)
              (out / 'open.exit').write_text(str(result.returncode))
              sys.stdout.buffer.write(result.stdout)
              sys.stderr.buffer.write(result.stderr)
              if result.returncode != 0:
                  status = result.returncode
              else:
                  response = json.loads(result.stdout)
                  assert response.get('success') is True, response
                  assert response.get('data', {}).get('appBundleId') == 'com.android.settings', response
                  snapshot = subprocess.run([*base, 'snapshot', '-i', *flags], env=env, capture_output=True)
                  (out / 'snapshot.stdout').write_bytes(snapshot.stdout)
                  (out / 'snapshot.stderr').write_bytes(snapshot.stderr)
                  (out / 'snapshot.exit').write_text(str(snapshot.returncode))
                  assert snapshot.returncode == 0, 'snapshot failed; original output retained'
                  metadata = json.loads(snapshot.stdout).get('data', {}).get('androidSnapshot', {})
                  assert metadata.get('backend') == 'android-helper', metadata
                  assert metadata.get('helperVersion') == json.loads(Path('package.json').read_text())['version'], metadata
                  status = 0
          finally:
              result = subprocess.run([*base, 'close', *flags], env=env, capture_output=True)
              (out / 'close.stdout').write_bytes(result.stdout)
              (out / 'close.stderr').write_bytes(result.stderr)
              (out / 'close.exit').write_text(str(result.returncode))
              if status == 0 and result.returncode != 0:
                  status = result.returncode
              clean = subprocess.run(['pnpm', 'clean:daemon'], capture_output=True)
              (out / 'cleanup.stdout').write_bytes(clean.stdout)
              (out / 'cleanup.stderr').write_bytes(clean.stderr)
              (out / 'cleanup.exit').write_text(str(clean.returncode))
              if status == 0 and clean.returncode != 0:
                  status = clean.returncode
          sys.exit(status)
          PROBE_PY
          sh scripts/replays/android-manual.sh "$@"
          PROBE_SH

      - name: Run Android full emulator suite
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          target: google_apis_playstore
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: sh .tmp/round21-android.sh "${{ steps.fixture-app.outputs.apk-path }}" "${{ steps.fixture-app.outputs.app-id }}" "${{ steps.android-setup.outputs.seconds }}"

      - name: Upload Android artifacts
        if: always()
        uses: ./.github/actions/upload-agent-device-artifacts
        with:
          artifact-name: replay-nightly-android-artifacts
          agent-state-dir: ${{ env.AGENT_DEVICE_STATE_DIR }}

  manual-ios:
    name: iOS Replay Suite
    runs-on: macos-26
    timeout-minutes: 80
    env:
      IOS_RUNTIME_VERSION: '26.2'
      AGENT_DEVICE_XCUITEST_ARCHS: 'arm64'
      AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.tmp/agent-device-state
      AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH: ${{ github.workspace }}/.tmp/ios-runner-derived
      AGENT_DEVICE_IOS_PREPARE_TIMEOUT_MS: '420000'
      AGENT_DEVICE_IOS_APP_EVENT_URL_TEMPLATE: agent-device-test-app:///automation?event={event}&payload={payload}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 3800feaefe6bf8627d7394c4495fbe8960ec8f40

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/test-app/pnpm-lock.yaml

      - name: Restore and build iOS XCTest runner
        uses: ./.github/actions/setup-apple-runner-build
        with:
          derived-path: ${{ env.AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH }}
          cache-key-prefix: ios-runner-prebuilt
          cache-key-suffix: -ios-${{ env.IOS_RUNTIME_VERSION }}-arm64
          gate: swift-runner-ios
          xcuitest-platform: ios
          xcuitest-destination: generic/platform=iOS Simulator

      - name: Boot iOS test simulator
        id: ios-simulator
        uses: ./.github/actions/boot-ios-test-simulator
        with:
          runtime-version: ${{ env.IOS_RUNTIME_VERSION }}
          preferred-device-name: iPhone 17 Pro

      - name: Preflight iOS runner through public CLI
        run: |
          pnpm clean:daemon
          node --experimental-strip-types src/bin.ts prepare ios-runner --platform ios --udid "${{ steps.ios-simulator.outputs.simulator-udid }}" --timeout "$AGENT_DEVICE_IOS_PREPARE_TIMEOUT_MS" --json

      - name: Run iOS simulator replay suite
        uses: ./.github/actions/run-gate
        with:
          gate: replay-ios
          args: |
            --udid
            ${{ steps.ios-simulator.outputs.simulator-udid }}
            --retries
            2
            --artifacts-dir
            test/artifacts/replays-ios-simulator
            --report-junit
            test/artifacts/replays-ios-simulator.junit.xml

      - name: Fetch current fixture app
        id: fixture-app
        uses: ./.github/actions/setup-fixture-app
        with:
          install: 'false'

      - name: Report fixture cache source
        run: |
          echo "Fixture app source: ${{ steps.fixture-app.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove selector drag reaches its destination on iOS
        run: |
          xcrun simctl install "${{ steps.ios-simulator.outputs.simulator-udid }}" "${{ steps.fixture-app.outputs.app-path }}"
          node --experimental-strip-types src/bin.ts replay examples/test-app/replays/drag.ad --platform ios --udid "${{ steps.ios-simulator.outputs.simulator-udid }}" --session nightly-ios-target-drag --json

      - name: Run full fixture-backed iOS simulator E2E
        env:
          AGENT_DEVICE_FIXTURE_APP_ID: ${{ steps.fixture-app.outputs.app-id }}
          AGENT_DEVICE_FIXTURE_APP_PATH: ${{ steps.fixture-app.outputs.app-path }}
          AGENT_DEVICE_IOS_E2E: '1'
          AGENT_DEVICE_IOS_E2E_TIER: full
          AGENT_DEVICE_IOS_UDID: ${{ steps.ios-simulator.outputs.simulator-udid }}
        run: |
          pnpm gate build
          node --experimental-strip-types scripts/node-test-tmpdir.ts --test test/integration/smoke-ios-simulator-coverage.test.ts test/integration/smoke-ios-simulator.test.ts

      - name: Run iOS physical device replay suite
        if: env.IOS_UDID != ''
        env:
          IOS_UDID: ${{ vars.IOS_UDID }}
        uses: ./.github/actions/run-gate
        with:
          gate: replay-ios-device
          args: |
            --udid
            ${{ env.IOS_UDID }}
            --retries
            2
            --artifacts-dir
            test/artifacts/replays-ios-device
            --report-junit
            test/artifacts/replays-ios-device.junit.xml

      - name: Upload iOS artifacts
        if: always()
        uses: ./.github/actions/upload-agent-device-artifacts
        with:
          artifact-name: replay-nightly-ios-artifacts
          agent-state-dir: ${{ env.AGENT_DEVICE_STATE_DIR }}
          runner-derived-path: ${{ env.AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH }}
