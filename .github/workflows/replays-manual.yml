---
name: PR3555 Targeted Native Evidence Round30
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr3555-native-round30-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-api36:
    name: PR3555 targeted native proof API 36
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_API: '36'
      EVIDENCE: "${{ github.workspace }}/.tmp/pr3555-round30-api36-evidence"
      AGENT_DEVICE_STATE_DIR: "${{ github.workspace }}/.tmp/pr3555-round30-api36-state"
    steps:
    - name: Checkout exact published PR3555 source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ce260138b8838fee2c18cdf023663f0d2de349f7
    - name: Setup Node 24.13 and frozen dependencies
      uses: "./.github/actions/setup-node-pnpm"
    - name: Setup isolated Android replay host
      uses: "./.github/actions/setup-android-replay-host"
      with:
        package-helpers: 'true'
    - name: Prepare observer and independently validate forwarding
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$EVIDENCE"
        cat > /tmp/review30-observer.cjs <<'REVIEW30_EOF'
        #!/usr/bin/env node
        'use strict';
        const fs = require('node:fs');
        const path = require('node:path');
        const { spawn } = require('node:child_process');
        const config = JSON.parse(fs.readFileSync(__filename + '.json', 'utf8'));
        const args = process.argv.slice(2);
        const query = ['cmd','package','resolve-activity','--brief','--query-flags','0x10000','-a','android.settings.SETTINGS'];
        const launch = ['am','start','-W','-a','android.settings.SETTINGS','-S','-R','1','--display','0'];
        const shell = args.indexOf('shell');
        const payload = shell >= 0 ? args.slice(shell + 1) : [];
        const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
        const owned = args.includes('-s') && args[args.indexOf('-s')+1] === config.serial;
        const kind = owned && same(payload,query) ? 'resolve' : owned && same(payload,launch) ? 'launch' : null;
        const child = spawn(config.real, args, { env: process.env, stdio: kind ? ['inherit','pipe','pipe'] : 'inherit' });
        const stdout = [], stderr = [];
        if (kind) {
          child.stdout.on('data', b => stdout.push(b));
          child.stderr.on('data', b => stderr.push(b));
          child.stdout.pipe(process.stdout);
          child.stderr.pipe(process.stderr);
        }
        for (const signal of ['SIGTERM','SIGINT','SIGHUP']) process.on(signal, () => child.kill(signal));
        child.on('error', error => { process.stderr.write(error.message + '\n'); process.exitCode = 127; });
        child.on('close', (code,signal) => {
          if (kind) fs.writeFileSync(path.join(config.records, `${Date.now()}-${process.pid}-${kind}.json`), JSON.stringify({ kind, executable:config.real, argv:args, stdoutBase64:Buffer.concat(stdout).toString('base64'), stderrBase64:Buffer.concat(stderr).toString('base64'), exitCode:code, signal }, null, 2));
          if (signal) { process.removeAllListeners(signal); process.kill(process.pid, signal); }
          else process.exitCode = code === null ? 127 : code;
        });
        REVIEW30_EOF
        cat > /tmp/review30-selfcheck.py <<'REVIEW30_EOF'
        import os,json,pathlib,subprocess,tempfile,signal
        proxy=pathlib.Path('/tmp/review30-observer.cjs')
        if not proxy.exists(): proxy=pathlib.Path('/private/tmp/review30-input/observer.cjs')
        with tempfile.TemporaryDirectory() as td:
         p=pathlib.Path(td); records=p/'records'; records.mkdir(); wrapper=p/'adb'; wrapper.write_bytes(proxy.read_bytes()); wrapper.chmod(0o755)
         fake=p/'native'; fake.write_text('#!/usr/bin/env python3\nimport os,sys,json,signal\nopen(os.environ["FAKE_ARGV"],"w").write(json.dumps(sys.argv[1:]))\nsys.stdout.buffer.write(b"native\\x00stdout\\n");sys.stdout.flush()\nsys.stderr.buffer.write(b"native stderr\\n");sys.stderr.flush()\nif os.environ.get("FAKE_SIGNAL"): os.kill(os.getpid(),signal.SIGTERM)\nsys.exit(int(os.environ["FAKE_CODE"]))\n'); fake.chmod(0o755)
         pathlib.Path(str(wrapper)+'.json').write_text(json.dumps(dict(real=str(fake),serial='owned',records=str(records))))
         query=['-s','owned','shell','cmd','package','resolve-activity','--brief','--query-flags','0x10000','-a','android.settings.SETTINGS']
         for code in [0,17]:
          env={**os.environ,'FAKE_CODE':str(code),'FAKE_ARGV':str(p/'argv')}; r=subprocess.run([str(wrapper),*query],env=env,capture_output=True)
          assert r.returncode==code and r.stdout==b'native\x00stdout\n' and r.stderr==b'native stderr\n'; assert json.loads((p/'argv').read_text())==query
         assert sorted(json.loads(f.read_text())['exitCode'] for f in records.iterdir())==[0,17]
         count=len(list(records.iterdir())); unknown=['-s','owned','shell','unknown','DO-NOT-RECORD']; r=subprocess.run([str(wrapper),*unknown],env=env,capture_output=True); assert r.returncode==17 and len(list(records.iterdir()))==count; assert json.loads((p/'argv').read_text())==unknown
         r=subprocess.run([str(wrapper),*query],env={**env,'FAKE_SIGNAL':'1'},capture_output=True); assert r.returncode==-signal.SIGTERM
        print('PASS: exact argv, byte streams, exit 0/nonzero 17, unknown suppression, direct-child SIGTERM forwarding')
        REVIEW30_EOF
        cat > /tmp/review30-measure.py <<'REVIEW30_EOF'
        import base64,hashlib,json,os,pathlib,shlex,shutil,subprocess,sys,time
        E=pathlib.Path(os.environ['EVIDENCE']); E.mkdir(parents=True,exist_ok=True)
        api=int(os.environ['EXPECTED_API']); state=os.environ['AGENT_DEVICE_STATE_DIR']; session='pr3555-round30-api'+str(api)
        results={}; conditions={}; transcript=[]
        def run(name,args):
         transcript.append('$ '+shlex.join(args)); p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE); (E/(name+'.stdout')).write_bytes(p.stdout); (E/(name+'.stderr')).write_bytes(p.stderr)
         r={'argv':args,'exitCode':p.returncode,'stdout':p.stdout.decode(errors='replace'),'stderr':p.stderr.decode(errors='replace')}; results[name]=r; transcript.extend([r['stdout'],r['stderr'],'exit='+str(p.returncode)]); return r
        def data(name):
         try: return json.loads(results[name]['stdout']).get('data',{})
         except Exception: return {}
        def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
        adb=pathlib.Path(os.environ['ANDROID_SDK_ROOT'])/'platform-tools/adb'; real=pathlib.Path(str(adb)+'.review30-original'); installed=False
        try:
         assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='ce260138b8838fee2c18cdf023663f0d2de349f7'
         devices=run('devices',[str(adb),'devices','-l']); owned=[line.split()[0] for line in devices['stdout'].splitlines() if len(line.split())>1 and line.split()[1]=='device']; assert len(owned)==1; serial=owned[0]
         sdk=run('sdk',[str(adb),'-s',serial,'shell','getprop','ro.build.version.sdk']); conditions['expectedApi']=sdk['exitCode']==0 and sdk['stdout'].strip()==str(api)
         run('identity',[str(adb),'-s',serial,'shell','getprop','ro.build.fingerprint']); run('avd',[str(adb),'-s',serial,'emu','avd','name'])
         integrity={'originalPath':str(adb),'nativePathDuringObservation':str(real),'originalSha256':sha(adb),'observerSha256':sha('/tmp/review30-observer.cjs'),'serial':serial,'instrumentation':'SDK-path host observer; timing perturbed; source untouched'}
         manifests={}
         for f in ['android/snapshot-helper/AndroidManifest.xml','android/ime-helper/AndroidManifest.xml']:
          dest=E/pathlib.Path(f).parent.name; dest.mkdir(exist_ok=True); shutil.copy2(f,dest/'AndroidManifest.xml'); manifests[f]={'sha256':sha(f),'gitBlob':subprocess.check_output(['git','rev-parse','HEAD:'+f],text=True).strip()}
         (E/'source-identity.json').write_text(json.dumps({'runtimeRevision':'ce260138b8838fee2c18cdf023663f0d2de349f7','packageVersion':json.loads(pathlib.Path('package.json').read_text())['version'],'manifests':manifests},indent=2))
         query=[str(adb),'-s',serial,'shell','cmd','package','resolve-activity','--brief','--query-flags','0x10000','-a','android.settings.SETTINGS']
         if api==23:
          r=run('minimum-resolve',query); conditions['minimumResolverSupported']=r['exitCode']==0 and any(x.startswith('com.android.settings/') for x in r['stdout'].splitlines()); results['minimumCapabilityStatus']='supported' if conditions['minimumResolverSupported'] else 'unsupported-or-error'; run('device-final-state',[str(adb),'-s',serial,'get-state']); integrity['restored']=True; integrity['observerInstalled']=False
         else:
          records=E/'native-records'; records.mkdir(); assert not real.exists(); adb.rename(real); installed=True
          config={'real':str(real),'serial':serial,'records':str(records)}; pathlib.Path(str(adb)+'.json').write_text(json.dumps(config)); shutil.copy2('/tmp/review30-observer.cjs',adb); adb.chmod(0o755)
          cli=['node','--experimental-strip-types','src/bin.ts']; common=['--platform','android','--serial',serial,'--session',session,'--state-dir',state,'--json']
          r=run('public-open',cli+['open','settings','--relaunch','--launch-args','-S','--launch-args','-R','--launch-args','1','--launch-args','--display','--launch-args','0']+common)
          observed=[json.loads(f.read_text()) for f in records.glob('*.json')]; conditions['publicOpen']=r['exitCode']==0 and data('public-open').get('appBundleId')=='com.android.settings'
          conditions['actualCliResolver']=any(x['kind']=='resolve' and x['exitCode']==0 and any(line.startswith('com.android.settings/') for line in base64.b64decode(x['stdoutBase64']).decode().splitlines()) for x in observed)
          conditions['actualCliLaunch']=any(x['kind']=='launch' and x['exitCode']==0 and 'Status: ok' in base64.b64decode(x['stdoutBase64']).decode() for x in observed)
          if r['exitCode']==0:
           run('snapshot',cli+['snapshot','-i']+common); m=data('snapshot').get('androidSnapshot',{}); version=json.loads(pathlib.Path('package.json').read_text())['version']; conditions['helperSnapshot']=results['snapshot']['exitCode']==0 and m.get('backend')=='android-helper' and m.get('helperVersion')==version
          else: conditions['helperSnapshot']=False
          run('session-list',cli+['session','list','--state-dir',state,'--json'])
          for f in pathlib.Path('android').glob('*/dist/*'):
           if f.is_file(): d=E/'helpers'/f.parent.parent.name; d.mkdir(parents=True,exist_ok=True); shutil.copy2(f,d/f.name)
        finally:
         if api==36 and 'serial' in locals():
          cli=['node','--experimental-strip-types','src/bin.ts']; common=['--platform','android','--serial',serial,'--session',session,'--state-dir',state,'--json']
          run('close',cli+['close']+common); run('daemon-stop',cli+['daemon','stop','--clean','--state-dir',state,'--json']); run('device-status-stale',cli+['device','status','--stale','--platform','android','--serial',serial,'--state-dir',state,'--json']); run('device-final-state',[str(adb),'-s',serial,'get-state'])
          conditions['cleanupCommands']=results['close']['exitCode']==0 and results['daemon-stop']['exitCode']==0 and results['device-status-stale']['exitCode']==0
         if installed:
          adb.unlink(); real.rename(adb); pathlib.Path(str(adb)+'.json').unlink(); integrity['restored']=sha(adb)==integrity['originalSha256']; conditions['observerRestored']=integrity['restored']
         if 'integrity' in locals(): (E/'observer-integrity.json').write_text(json.dumps(integrity,indent=2))
         if pathlib.Path(state).exists(): shutil.copytree(state,E/'daemon-state',dirs_exist_ok=True)
         (E/'literal-command-transcript.txt').write_text('\n'.join(transcript))
         (E/'measurement.json').write_text(json.dumps({'api':api,'conditions':conditions,'results':results,'passed':bool(conditions) and all(conditions.values())},indent=2))
         print(json.dumps({'api':api,'conditions':conditions},indent=2))
         if not conditions or not all(conditions.values()): sys.exit(1)
        REVIEW30_EOF
        node --check /tmp/review30-observer.cjs
        python3 /tmp/review30-selfcheck.py | tee "$EVIDENCE/observer-selfcheck.txt"
        python3 -c 'import ast,pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ["/tmp/review30-selfcheck.py","/tmp/review30-measure.py"]]'
    - name: Verify selected SDK image exists and preserve identity
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list > "$EVIDENCE/sdkmanager-list.txt"
        python3 - "$EVIDENCE/sdkmanager-list.txt" 'system-images;android-36;google_apis_playstore;x86_64' <<'PYVERIFY'
        import pathlib,sys
        assert any(line.strip().split(' | ')[0].strip()==sys.argv[2] for line in pathlib.Path(sys.argv[1]).read_text().splitlines()), 'selected system image absent'
        PYVERIFY
        git rev-parse HEAD > "$EVIDENCE/runtime-revision.txt"
        printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/workflow-revision.txt"
        sha256sum android/snapshot-helper/AndroidManifest.xml android/ime-helper/AndroidManifest.xml > "$EVIDENCE/source-manifest-sha256.txt"
        pnpm gate build
        pnpm clean:daemon
    - name: Measure targeted API 36 native evidence
      uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
      with:
        api-level: 36
        arch: x86_64
        profile: pixel_7
        target: google_apis_playstore
        emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          -no-boot-anim -no-metrics"
        script: python3 /tmp/review30-measure.py
    - name: Record emulator runner final state
      if: always()
      shell: bash
      run: |
        set +e
        "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platform-tools/adb" devices -l > "$EVIDENCE/emulator-runner-final-state.stdout" 2> "$EVIDENCE/emulator-runner-final-state.stderr"
        code=$?
        printf '%s\n' "$code" > "$EVIDENCE/emulator-runner-final-state.exit"
        python3 - <<'PYFINAL'
        import os,pathlib,json
        p=pathlib.Path(os.environ['EVIDENCE']); out=(p/'emulator-runner-final-state.stdout').read_text(); code=int((p/'emulator-runner-final-state.exit').read_text()); devices=[line for line in out.splitlines() if line.startswith('emulator-')]
        (p/'emulator-runner-cleanup.json').write_text(json.dumps({'exitCode':code,'remainingEmulators':devices,'verifiedStopped':code==0 and not devices},indent=2))
        assert code==0 and not devices, 'owned emulator final cleanup is unverified'
        PYFINAL
    - name: Digest retained native evidence
      if: always()
      shell: bash
      run: |
        python3 - <<'PYDIGEST'
        import hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['EVIDENCE']); (p/'digests.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file() and f.name!='digests.json'},indent=2))
        PYDIGEST
    - name: Upload targeted native proof (including failures)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr3555-round30-api36-native-evidence
        path: "${{ env.EVIDENCE }}"
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
