          const args = process.argv.slice(2);
          const phase = config.phasePath ? fs.readFileSync(config.phasePath, 'utf8') : 'selfcheck';
          const recordId = `${Date.now()}-${process.pid}`;
          const record = { recordId, phase, executable:config.real, argv:args, startUnixMs:Date.now() };
          fs.writeFileSync(path.join(config.records, recordId + '.start.json'), JSON.stringify(record, null, 2));
          const bounded = config.deadlineUnixMs !== undefined;
          const remaining = bounded ? config.deadlineUnixMs - Date.now() : Infinity;
          if (bounded && remaining <= 0) {
            fs.writeFileSync(path.join(config.records, recordId + '.json'), JSON.stringify({ ...record, nativeStarted:false, classification:'deadline-rejected', exitCode:124, stdoutBase64:'', stderrBase64:'', endUnixMs:Date.now() }, null, 2));
            process.exit(124);
          }
          record.nativeStarted = true;
          record.deadlineUnixMs = config.deadlineUnixMs;
