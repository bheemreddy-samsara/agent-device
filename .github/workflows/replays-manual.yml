---
name: PR3555 Targeted Native Evidence Round32
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr3555-native-round32-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-api36:
    name: PR3555 targeted native proof API 36
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_API: '36'
      EVIDENCE: "${{ github.workspace }}/.tmp/pr3555-round32-api36-evidence"
      AGENT_DEVICE_STATE_DIR: "${{ github.workspace }}/.tmp/pr3555-round32-api36-state"
    steps:
    - name: Checkout exact published PR3555 source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: b69a3421a7d32d801540994b827b09dcf6cc5e70
    - name: Setup Node 24.13 and frozen dependencies
      uses: "./.github/actions/setup-node-pnpm"
    - name: Setup isolated Android replay host
      uses: "./.github/actions/setup-android-replay-host"
      with:
        package-helpers: 'true'
    - name: Prepare observer and independently validate forwarding
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$EVIDENCE"
        cat > /tmp/review32-observer.cjs <<'REVIEW32_EOF'
        #!/usr/bin/env node
        'use strict';
        const fs = require('node:fs');
        const path = require('node:path');
        const { spawn } = require('node:child_process');
        const config = JSON.parse(fs.readFileSync(__filename + '.json', 'utf8'));
        const args = process.argv.slice(2);
        const phase = config.phasePath ? fs.readFileSync(config.phasePath, 'utf8') : 'selfcheck';
        const recordId = `${Date.now()}-${process.pid}`;
        const record = { recordId, phase, executable:config.real, argv:args, startUnixMs:Date.now() };
        fs.writeFileSync(path.join(config.records, recordId + '.start.json'), JSON.stringify(record, null, 2));
        const child = spawn(config.real, args, { env: process.env, stdio:['inherit','pipe','pipe'] });
        const stdout = [], stderr = [];
        child.stdout.on('data', b => stdout.push(b));
        child.stderr.on('data', b => stderr.push(b));
        child.stdout.pipe(process.stdout);
        child.stderr.pipe(process.stderr);
        for (const signal of ['SIGTERM','SIGINT','SIGHUP']) process.on(signal, () => child.kill(signal));
        child.on('error', error => { process.stderr.write(error.message + '\n'); process.exitCode = 127; });
        child.on('close', (code,signal) => {
          fs.writeFileSync(path.join(config.records, recordId + '.json'), JSON.stringify({ ...record, stdoutBase64:Buffer.concat(stdout).toString('base64'), stderrBase64:Buffer.concat(stderr).toString('base64'), exitCode:code, signal, endUnixMs:Date.now() }, null, 2));
          if (signal) { process.removeAllListeners(signal); process.kill(process.pid, signal); }
          else process.exitCode = code === null ? 127 : code;
        });
        REVIEW32_EOF
        cat > /tmp/review32-selfcheck.py <<'REVIEW32_EOF'
        import os,json,pathlib,subprocess,tempfile,signal
        proxy=pathlib.Path('/tmp/review32-observer.cjs')
        if not proxy.exists(): proxy=pathlib.Path('/private/tmp/review32-input/observer.cjs')
        with tempfile.TemporaryDirectory() as td:
         p=pathlib.Path(td); records=p/'records'; records.mkdir(); wrapper=p/'adb'; wrapper.write_bytes(proxy.read_bytes()); wrapper.chmod(0o755)
         fake=p/'native'; fake.write_text('#!/usr/bin/env python3\nimport os,sys,json,signal\nopen(os.environ["FAKE_ARGV"],"w").write(json.dumps(sys.argv[1:]))\nsys.stdout.buffer.write(b"native\\x00stdout\\n");sys.stdout.flush()\nsys.stderr.buffer.write(b"native stderr\\n");sys.stderr.flush()\nif os.environ.get("FAKE_SIGNAL"): os.kill(os.getpid(),signal.SIGTERM)\nsys.exit(int(os.environ["FAKE_CODE"]))\n'); fake.chmod(0o755)
         pathlib.Path(str(wrapper)+'.json').write_text(json.dumps(dict(real=str(fake),serial='owned',records=str(records))))
         query=['-s','owned','shell','cmd','package','resolve-activity','--brief','--query-flags','0x10000','-a','android.settings.SETTINGS']
         for code in [0,17]:
          env={**os.environ,'FAKE_CODE':str(code),'FAKE_ARGV':str(p/'argv')}; r=subprocess.run([str(wrapper),*query],env=env,capture_output=True)
          assert r.returncode==code and r.stdout==b'native\x00stdout\n' and r.stderr==b'native stderr\n'; assert json.loads((p/'argv').read_text())==query
         assert sorted(json.loads(f.read_text())['exitCode'] for f in records.glob('*.json') if not f.name.endswith('.start.json'))==[0,17]
         count=len(list(records.iterdir())); unknown=['-s','owned','shell','unknown','DO-NOT-RECORD']; r=subprocess.run([str(wrapper),*unknown],env=env,capture_output=True); assert r.returncode==17 and len(list(records.iterdir()))==count+2; assert json.loads((p/'argv').read_text())==unknown
         r=subprocess.run([str(wrapper),*query],env={**env,'FAKE_SIGNAL':'1'},capture_output=True); assert r.returncode==-signal.SIGTERM
        print('PASS: exact argv, byte streams, exit 0/nonzero 17, all-invocation observation, direct-child SIGTERM forwarding')
        REVIEW32_EOF
        cat > /tmp/review32-measure.py <<'REVIEW32_EOF'
        import base64,hashlib,json,os,pathlib,shlex,shutil,subprocess,sys,time,traceback
        E=pathlib.Path(os.environ['EVIDENCE']); E.mkdir(parents=True,exist_ok=True)
        api=int(os.environ['EXPECTED_API']); state=os.environ['SUBJECT_STATE_DIR']; session='pr3555-round32-api'+str(api)
        revision='b69a3421a7d32d801540994b827b09dcf6cc5e70'; results={}; conditions={}; transcript=[]; installed=False; created=False; integrity={}; serial='emulator-5554'
        def run(name,args):
         transcript.append('$ '+shlex.join(args))
         try: p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120); code=p.returncode; out=p.stdout; err=p.stderr
         except subprocess.TimeoutExpired as x: code=124; out=x.stdout or b''; err=(x.stderr or b'')+b'\nHOST HARNESS TIMEOUT 120s\n'
         (E/(name+'.stdout')).write_bytes(out); (E/(name+'.stderr')).write_bytes(err)
         r={'argv':args,'exitCode':code,'stdout':out.decode(errors='replace'),'stderr':err.decode(errors='replace')}; results[name]=r; transcript.extend([r['stdout'],r['stderr'],'exit='+str(code)]); return r
        def obj(name):
         try: return json.loads(results[name]['stdout'])
         except Exception: return {}
        def data(name): return obj(name).get('data',{})
        def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
        def emulators():
         found=[]
         for p in pathlib.Path('/proc').glob('[0-9]*/cmdline'):
          try:
           args=p.read_bytes().split(b'\0'); executable=args[0].decode(errors='replace')
           if pathlib.Path(executable).name=='emulator' or pathlib.Path(executable).name.startswith('qemu-system-'): found.append({'pid':int(p.parent.name),'argv':[a.decode(errors='replace') for a in args if a]})
          except (OSError,ValueError): pass
         return found
        adb=pathlib.Path(os.environ['ANDROID_SDK_ROOT'])/'platform-tools/adb'; real=pathlib.Path(str(adb)+'.review32-original'); phase=E/'observer-phase.txt'; records=E/'native-records'; records.mkdir(exist_ok=True)
        cli=['node','--experimental-strip-types','src/bin.ts']; common=['--platform','android','--serial',serial,'--session',session,'--state-dir',state,'--json']
        try:
         conditions['exactSource']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==revision; assert conditions['exactSource']
         conditions['distinctPreparationState']=state!=os.environ['AGENT_DEVICE_STATE_DIR']; assert conditions['distinctPreparationState']
         devices=run('devices',[str(adb),'devices','-l']); owned=[line.split()[0] for line in devices['stdout'].splitlines() if len(line.split())>1 and line.split()[1]=='device']; assert owned==[serial]
         sdk=run('sdk',[str(adb),'-s',serial,'shell','getprop','ro.build.version.sdk']); conditions['expectedApi']=sdk['exitCode']==0 and sdk['stdout'].strip()==str(api)
         run('identity',[str(adb),'-s',serial,'shell','getprop','ro.build.fingerprint']); run('os-release',[str(adb),'-s',serial,'shell','getprop','ro.build.version.release']); run('avd',[str(adb),'-s',serial,'emu','avd','name']); (E/'emulator-processes-start.json').write_text(json.dumps(emulators(),indent=2))
         version=json.loads(pathlib.Path('package.json').read_text())['version']; sources={}
         for f in ['package.json','src/bin.ts','packages/platform-android/src/lifecycle.ts','packages/platform-android/src/open-target-resolution.ts','android/snapshot-helper/AndroidManifest.xml','android/ime-helper/AndroidManifest.xml']:
          dest=E/'source'/f; dest.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(f,dest); sources[f]={'sha256':sha(f),'gitBlob':subprocess.check_output(['git','rev-parse','HEAD:'+f],text=True).strip()}
         (E/'source-identity.json').write_text(json.dumps({'runtimeRevision':revision,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'packageVersion':version,'sources':sources,'trackedDiff':subprocess.check_output(['git','diff','HEAD','--'],text=True)},indent=2))
         for f in pathlib.Path('android').glob('*/dist/*'):
          if f.is_file(): dest=E/'helpers'/f.parent.parent.name; dest.mkdir(parents=True,exist_ok=True); shutil.copy2(f,dest/f.name)
         run('session-list-before',cli+['session','list','--state-dir',state,'--json']); conditions['sessionInitiallyAbsent']=results['session-list-before']['exitCode']==0 and data('session-list-before').get('sessions')==[]; assert conditions['sessionInitiallyAbsent']
         integrity={'originalPath':str(adb),'nativePathDuringObservation':str(real),'originalSha256':sha(adb),'observerSha256':sha('/tmp/review32-observer.cjs'),'serial':serial,'instrumentation':'SDK-path host observer recording every invocation; timing perturbed; shipping source untouched'}
         assert not real.exists(); adb.rename(real); installed=True; phase.write_text('pre-subject')
         pathlib.Path(str(adb)+'.json').write_text(json.dumps({'real':str(real),'serial':serial,'records':str(records),'phasePath':str(phase)})); shutil.copy2('/tmp/review32-observer.cjs',adb); adb.chmod(0o755)
         # The separate direct query is outside the public operation's observation window.
         run('direct-resolver',[str(adb),'-s',serial,'shell','cmd','package','resolve-activity','--brief','--query-flags','0x10000','-a','android.settings.SETTINGS'])
         phase.write_text('public-open'); start=time.time_ns()
         r=run('public-open',cli+['open','settings','--relaunch','--launch-args','-S','--launch-args','-R','--launch-args','1','--launch-args','--display','--launch-args','0']+common)
         end=time.time_ns(); phase.write_text('post-subject'); (E/'observation-window.json').write_text(json.dumps({'startUnixNs':start,'endUnixNs':end,'phase':'public-open','includesCleanup':False},indent=2))
         observed=[json.loads(f.read_text()) for f in records.glob('*.json') if not f.name.endswith('.start.json')]; subject=[x for x in observed if x['phase']=='public-open']; starts=[json.loads(f.read_text()) for f in records.glob('*.start.json') if json.loads(f.read_text())['phase']=='public-open']; (E/'subject-native-executions.json').write_text(json.dumps(subject,indent=2))
         blockingStarts=starts if api==23 else [x for x in starts if 'shell' in x['argv'] and any(v in ('cmd','am') for v in x['argv'][x['argv'].index('shell')+1:])]
         conditions['observerComplete']=bool(subject) and {x['recordId'] for x in blockingStarts}.issubset({x['recordId'] for x in subject})
         query=['-s',serial,'shell','cmd','package','resolve-activity','--brief','--query-flags','0x10000','-a','android.settings.SETTINGS']; launch=['-s',serial,'shell','am','start','-W','-a','android.settings.SETTINGS','-S','-R','1','--display','0']; resolvers=[x for x in subject if x['argv']==query]
         conditions['actualCliResolver']=bool(resolvers)
         created=r['exitCode']==0
         if api==23:
          error=obj('public-open').get('error',{}); conditions['explicitOwnerRefusal']=r['exitCode']==1 and obj('public-open').get('success') is False and error.get('code')=='COMMAND_FAILED' and error.get('details',{}).get('reason')=='android-relaunch-owner-unresolved'
          conditions['nativeResolverUnavailable']=bool(resolvers) and all(x['exitCode']==0 and base64.b64decode(x['stdoutBase64'])==b'/system/bin/sh: cmd: not found\r\n' and base64.b64decode(x['stderrBase64'])==b'' for x in resolvers)
          # Every SDK ADB invocation is retained; rejecting any am/monkey payload prevents alternate launch or force-stop from passing.
          effects=[x for x in starts if 'shell' in x['argv'] and any(v in ('am','monkey') or 'am start' in v or 'am force-stop' in v or 'monkey ' in v for v in x['argv'][x['argv'].index('shell')+1:])]
          conditions['noNativeLifecycleEffects']=not effects; (E/'subject-lifecycle-effects.json').write_text(json.dumps(effects,indent=2))
         else:
          conditions['publicOpenOwner']=r['exitCode']==0 and data('public-open').get('appBundleId')=='com.android.settings'
          conditions['resolverOwner']=bool(resolvers) and all(x['exitCode']==0 and any(l.startswith('com.android.settings/') for l in base64.b64decode(x['stdoutBase64']).decode().splitlines()) for x in resolvers)
          conditions['unchangedLaunchArgv']=any(x['argv']==launch and x['exitCode']==0 and b'Status: ok' in base64.b64decode(x['stdoutBase64']) for x in subject)
          if created:
           run('snapshot',cli+['snapshot','-i']+common); m=data('snapshot').get('androidSnapshot',{}); conditions['helperSnapshot']=results['snapshot']['exitCode']==0 and m.get('backend')=='android-helper' and m.get('helperVersion')==version
          else: conditions['helperSnapshot']=False
         run('session-list-after-operation',cli+['session','list','--state-dir',state,'--json']); sessions=data('session-list-after-operation').get('sessions'); conditions['sessionIdentity']=results['session-list-after-operation']['exitCode']==0 and (sessions==[] if api==23 else isinstance(sessions,list) and len(sessions)==1 and sessions[0].get('name')==session and sessions[0].get('id')==serial)
        except Exception:
         (E/'harness-exception.txt').write_text(traceback.format_exc()); conditions['harnessCompleted']=False
        finally:
         if installed:
          adb.unlink(); real.rename(adb); pathlib.Path(str(adb)+'.json').unlink(); integrity['restoredSha256']=sha(adb); integrity['restored']=integrity['restoredSha256']==integrity['originalSha256']; conditions['observerRestored']=integrity['restored']
         if integrity: (E/'observer-integrity.json').write_text(json.dumps(integrity,indent=2))
         if created and api==36: run('close',cli+['close']+common); conditions['sessionClosed']=results['close']['exitCode']==0
         if pathlib.Path(state).exists():
          run('session-list-cleanup',cli+['session','list','--state-dir',state,'--json']); conditions['ownedSessionsAbsent']=results['session-list-cleanup']['exitCode']==0 and data('session-list-cleanup').get('sessions')==[]
          run('daemon-stop',cli+['daemon','stop','--clean','--state-dir',state,'--json']); d=data('daemon-stop'); conditions['daemonStoppedClean']=results['daemon-stop']['exitCode']==0 and d.get('stopped') is True and d.get('clean') is True and d.get('cleanupConfidence')=='known' and d.get('providerReleases',{}).get('pending')==[] and d.get('claimsOrphaned')==[] and d.get('claimsUnattributable')==[] and d.get('claimsSuperseded')==[]
          run('device-status-stale',cli+['device','status','--stale','--platform','android','--serial',serial,'--json']); conditions['supportedDeviceStatus']=results['device-status-stale']['exitCode']==0 and data('device-status-stale').get('claims')==[]
          run('device-status',cli+['device','status','--platform','android','--serial',serial,'--json']); conditions['noDeviceClaims']=results['device-status']['exitCode']==0 and data('device-status').get('claims')==[] and data('device-status').get('hiddenStaleClaims')==0
          shutil.copytree(state,E/'daemon-state',dirs_exist_ok=True)
         run('device-final-state',[str(adb),'-s',serial,'get-state'])
         (E/'literal-command-transcript.txt').write_text('\n'.join(transcript)); (E/'measurement.json').write_text(json.dumps({'api':api,'conditions':conditions,'results':results,'passed':bool(conditions) and all(conditions.values())},indent=2)); print(json.dumps({'api':api,'conditions':conditions},indent=2))
         if not conditions or not all(conditions.values()): sys.exit(1)
        REVIEW32_EOF
        node --check /tmp/review32-observer.cjs
        python3 /tmp/review32-selfcheck.py | tee "$EVIDENCE/observer-selfcheck.txt"
        python3 -c 'import ast,pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ["/tmp/review32-selfcheck.py","/tmp/review32-measure.py"]]'
    - name: Verify selected SDK image exists and preserve identity
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list > "$EVIDENCE/sdkmanager-list.txt"
        python3 - "$EVIDENCE/sdkmanager-list.txt" 'system-images;android-36;google_apis_playstore;x86_64' <<'PYVERIFY'
        import pathlib,sys
        assert any(line.strip().split(' | ')[0].strip()==sys.argv[2] for line in pathlib.Path(sys.argv[1]).read_text().splitlines()), 'selected system image absent'
        PYVERIFY
        git rev-parse HEAD > "$EVIDENCE/runtime-revision.txt"
        printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/workflow-revision.txt"
        sha256sum android/snapshot-helper/AndroidManifest.xml android/ime-helper/AndroidManifest.xml > "$EVIDENCE/source-manifest-sha256.txt"
        pnpm gate build
        pnpm clean:daemon
        node --experimental-strip-types --input-type=module - <<'CLIPREREQUISITES' > "$EVIDENCE/cli-prerequisites.json"
        import assert from 'node:assert/strict';
        import { resolveCliOptions } from './src/cli/resolve-cli-options.ts';
        import { readInputFromCli } from './src/commands/cli-grammar.ts';
        const common=['--platform','android','--serial','emulator-5554','--session','pr3555-round32-check','--state-dir','/private/tmp/pr3555-round32-check','--json'];
        const cases=[['open','settings','--relaunch','--launch-args','-S','--launch-args','-R','--launch-args','1','--launch-args','--display','--launch-args','0',...common], ['snapshot','-i',...common], ['close',...common],['session','list','--state-dir','/private/tmp/pr3555-round32-check','--json'],['daemon','stop','--clean','--state-dir','/private/tmp/pr3555-round32-check','--json'],['device','status','--stale','--platform','android','--serial','emulator-5554','--json'],['device','status','--platform','android','--serial','emulator-5554','--json']];
        const parsed=cases.map(argv=>({argv,parsed:resolveCliOptions(argv,{cwd:process.cwd(),env:process.env,strictFlags:true})}));
        assert.deepEqual(parsed[0].parsed.flags.launchArgs,['-S','-R','1','--display','0']);
        const input=readInputFromCli('open',parsed[0].parsed.positionals,parsed[0].parsed.flags);
        assert.equal(input.relaunch,true);
        assert.deepEqual(input.launchArgs,['-S','-R','1','--display','0']);
        assert.throws(()=>resolveCliOptions(['device','status','--state-dir','/private/tmp/invalid'],{strictFlags:true}));
        console.log(JSON.stringify({passed:true,parsed,publicOpenInput:input},null,2));
        CLIPREREQUISITES
        node --experimental-strip-types --input-type=module - <<'SUBJECTSTATE' > "$EVIDENCE/subject-state-construction.json"
        import { createOwnedReplayStateDir } from '@agent-device/daemon-contracts/daemon-registration-owner';
        const owned = createOwnedReplayStateDir();
        console.log(JSON.stringify({ source: 'createOwnedReplayStateDir', preparationState: process.env.AGENT_DEVICE_STATE_DIR, subjectState: owned.paths.baseDir, paths: owned.paths }, null, 2));
        SUBJECTSTATE
        node -e 'const fs=require("node:fs"); const state=JSON.parse(fs.readFileSync(process.env.EVIDENCE+"/subject-state-construction.json", "utf8")); if(state.preparationState===state.subjectState) process.exit(1); fs.appendFileSync(process.env.GITHUB_ENV, "SUBJECT_STATE_DIR="+state.subjectState+"\n");'
        test -x "$SDK_ROOT/platform-tools/adb"
        test ! -e "$SDK_ROOT/platform-tools/adb.review32-original"
        for source in package.json src/bin.ts packages/platform-android/src/lifecycle.ts packages/platform-android/src/open-target-resolution.ts android/snapshot-helper/AndroidManifest.xml android/ime-helper/AndroidManifest.xml; do
          test -f "$source"
          git rev-parse "HEAD:$source" > /dev/null
        done
    - name: Measure targeted API 36 native evidence
      uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
      with:
        api-level: 36
        arch: x86_64
        profile: pixel_7
        target: google_apis_playstore
        emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          -no-boot-anim -no-metrics"
        script: python3 /tmp/review32-measure.py
    - name: Record emulator runner final state
      if: always()
      shell: bash
      run: |
        set +e
        "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platform-tools/adb" devices -l > "$EVIDENCE/emulator-runner-final-state.stdout" 2> "$EVIDENCE/emulator-runner-final-state.stderr"
        code=$?
        printf '%s\n' "$code" > "$EVIDENCE/emulator-runner-final-state.exit"
        python3 - <<'PYFINAL'
        import os,pathlib,json,subprocess,time
        p=pathlib.Path(os.environ['EVIDENCE']); adb=str(pathlib.Path(os.environ.get('ANDROID_SDK_ROOT',os.environ['ANDROID_HOME']))/'platform-tools/adb'); checks=[]
        def processes():
         found=[]
         for f in pathlib.Path('/proc').glob('[0-9]*/cmdline'):
          try:
           args=f.read_bytes().split(b'\0'); name=pathlib.Path(args[0].decode(errors='replace')).name
           if name=='emulator' or name.startswith('qemu-system-'): found.append({'pid':int(f.parent.name),'argv':[a.decode(errors='replace') for a in args if a]})
          except (OSError,ValueError): pass
         return found
        for attempt in range(16):
         r=subprocess.run([adb,'-s','emulator-5554','get-state'],capture_output=True,timeout=10); live=processes(); checks.append({'attempt':attempt,'liveEmulatorProcesses':live,'getStateExit':r.returncode,'stdout':r.stdout.decode(errors='replace'),'stderr':r.stderr.decode(errors='replace')})
         if not live and r.returncode!=0: break
         if attempt<15: time.sleep(2)
        verified=not checks[-1]['liveEmulatorProcesses'] and checks[-1]['getStateExit']!=0
        (p/'emulator-runner-cleanup.json').write_text(json.dumps({'checks':checks,'verifiedStopped':verified,'basis':'no live emulator or qemu-system process and owned serial get-state fails; stale offline ADB entries do not establish a live emulator'},indent=2))
        assert verified, 'owned emulator final cleanup is unverified'
        PYFINAL
    - name: Digest retained native evidence
      if: always()
      shell: bash
      run: |
        python3 - <<'PYDIGEST'
        import hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['EVIDENCE']); (p/'digests.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file() and f.name!='digests.json'},indent=2))
        PYDIGEST
    - name: Upload targeted native proof (including failures)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr3555-round32-api36-native-evidence
        path: "${{ env.EVIDENCE }}"
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  native-api23:
    name: PR3555 targeted native proof API 23
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_API: '23'
      EVIDENCE: "${{ github.workspace }}/.tmp/pr3555-round32-api23-evidence"
      AGENT_DEVICE_STATE_DIR: "${{ github.workspace }}/.tmp/pr3555-round32-api23-state"
    steps:
    - name: Checkout exact published PR3555 source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
