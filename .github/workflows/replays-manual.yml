name: Replay Manual

# Parked here by #1781 A1. Both suites failed every scheduled run from 2026-07-24 on — the
# Android suite inside full-tier scenarios that had never executed end to end, the iOS suite
# on varying steps — so on a schedule they only produced noise. Manual dispatch keeps them
# runnable while they are being repaired; `pnpm check:gate-manifest` reports the checks they
# declare as manual-only (scripts/gate/declarations.ts) so the missing owner stays visible.
# Move these jobs back into replays-nightly.yml once a dispatch run is green.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-android:
    if: ${{ false }}
    name: Android Full Emulator Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.tmp/android-e2e-state
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Android replay host
        id: android-replay-host
        uses: ./.github/actions/setup-android-replay-host
        with:
          package-helpers: 'true'

      - name: Restore Android fixture APK
        id: fixture-app
        uses: ./.github/actions/setup-fixture-app
        with:
          platform: android
          install: 'false'
          require-artifact: 'true'

      - name: Mark Android emulator setup complete
        id: android-setup
        run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Android full emulator suite
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          target: google_apis_playstore
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: sh scripts/replays/android-manual.sh "${{ steps.fixture-app.outputs.apk-path }}" "${{ steps.fixture-app.outputs.app-id }}" "${{ steps.android-setup.outputs.seconds }}"

      - name: Upload Android artifacts
        if: always()
        uses: ./.github/actions/upload-agent-device-artifacts
        with:
          artifact-name: replay-nightly-android-artifacts
          agent-state-dir: ${{ env.AGENT_DEVICE_STATE_DIR }}

  manual-ios:
    name: iOS Replay Suite
    runs-on: macos-26
    timeout-minutes: 80
    env:
      IOS_RUNTIME_VERSION: '26.2'
      AGENT_DEVICE_XCUITEST_ARCHS: 'arm64'
      AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.tmp/agent-device-state
      AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH: ${{ github.workspace }}/.tmp/ios-runner-derived
      AGENT_DEVICE_IOS_PREPARE_TIMEOUT_MS: '420000'
      AGENT_DEVICE_IOS_APP_EVENT_URL_TEMPLATE: agent-device-test-app:///automation?event={event}&payload={payload}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: f22ddb765811c9558025d4f3c0b7be14472bfac7

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/test-app/pnpm-lock.yaml

      - name: Restore and build iOS XCTest runner
        uses: ./.github/actions/setup-apple-runner-build
        with:
          derived-path: ${{ env.AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH }}
          cache-key-prefix: ios-runner-prebuilt
          cache-key-suffix: -ios-${{ env.IOS_RUNTIME_VERSION }}-arm64
          gate: swift-runner-ios
          xcuitest-platform: ios
          xcuitest-destination: generic/platform=iOS Simulator

      - name: Boot iOS test simulator
        id: ios-simulator
        uses: ./.github/actions/boot-ios-test-simulator
        with:
          runtime-version: ${{ env.IOS_RUNTIME_VERSION }}
          preferred-device-name: iPhone 17 Pro

      - name: Preflight iOS runner through public CLI
        run: |
          pnpm clean:daemon
          python3 - "${{ steps.ios-simulator.outputs.simulator-udid }}" <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import threading
          import time

          out = Path('test/artifacts/ios-bootstrap-diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          state = Path(os.environ['AGENT_DEVICE_STATE_DIR'])
          source = str(Path('src/daemon.ts').resolve())
          started = time.monotonic()
          stop = threading.Event()
          lock = threading.Lock()
          samples = []

          def event(kind, **data):
              record = dict(kind=kind, elapsedMs=round((time.monotonic()-started)*1000), **data)
              try:
                  with lock:
                      with (out / 'timeline.jsonl').open('a') as f:
                          f.write(json.dumps(record) + '\n')
              except OSError:
                  pass

          def ps(pid):
              try:
                  result = subprocess.run(['ps', '-ww', '-p', str(pid), '-o', 'pid=,ppid=,stat=,etime=,time=,%cpu=,command='], capture_output=True, text=True, timeout=2)
                  return result.returncode, result.stdout.strip()
              except subprocess.TimeoutExpired:
                  event('process_query_timeout', pid=pid)
                  return -1, ''

          def is_owned_child(pid, parent):
              code, row = ps(pid)
              fields = row.split(None, 6)
              return code == 0 and len(fields) == 7 and int(fields[1]) == parent and source in fields[6].split()

          def sample(pid, parent, label):
              try:
                  if not is_owned_child(pid, parent):
                      event('sample_skipped_identity', pid=pid, label=label)
                      return
                  event('sample_begin', pid=pid, label=label)
                  result = subprocess.run(['/usr/bin/sample', str(pid), '3', '-mayDie', '-file', str((out / (label + '.sample.txt')).resolve())], capture_output=True, text=True, timeout=45)
                  (out / (label + '.sample-command.txt')).write_text(result.stdout + result.stderr)
                  event('sample_end', pid=pid, label=label, exitCode=result.returncode)
              except subprocess.TimeoutExpired as e:
                  partial = (e.stdout or b'') + (e.stderr or b'')
                  if isinstance(partial, bytes):
                      partial = partial.decode('utf-8', errors='replace')
                  (out / (label + '.sample-command.txt')).write_text(partial)
                  event('sample_error', pid=pid, label=label, error=str(e))
              except Exception as e:
                  event('sample_error', pid=pid, label=label, error=str(e))

          def launch_sample(pid, parent, label):
              thread = threading.Thread(target=sample, args=(pid, parent, label), daemon=True)
              samples.append(thread)
              thread.start()

          def observe(parent):
              seen = {}
              child = None
              discovered = None
              late = False
              try:
                  while not stop.is_set() and time.monotonic()-started < 22:
                      code, row = ps(parent)
                      event('parent_process', exitCode=code, process=row)
                      if child is None:
                          try:
                              children = subprocess.run(['pgrep', '-P', str(parent)], capture_output=True, text=True, timeout=2)
                              child_pids = children.stdout.split()
                          except subprocess.TimeoutExpired:
                              event('child_query_timeout', parentPid=parent)
                              child_pids = []
                          for value in child_pids:
                              pid = int(value)
                              if is_owned_child(pid, parent):
                                  child, discovered = pid, time.monotonic()
                                  event('owned_daemon_discovered', pid=pid, parentPid=parent, process=ps(pid)[1], absoluteSource=source)
                                  launch_sample(pid, parent, 'near-spawn')
                                  break
                      if child is not None:
                          code, row = ps(child)
                          event('daemon_process', pid=child, exitCode=code, process=row)
                          if not late and time.monotonic()-discovered >= 9:
                              late = True
                              launch_sample(child, parent, 'before-deadline')
                      for name in ('daemon.json', 'daemon.lock', 'daemon.lock/owner.json', 'daemon.log'):
                          file = state / name
                          try:
                              if file.is_dir():
                                  event('state_directory', name=name)
                                  continue
                              raw = file.read_bytes()
                              digest = hashlib.sha256(raw).hexdigest()
                              event('state_file', name=name, bytes=len(raw), sha256=digest)
                              if seen.get(name) != digest:
                                  seen[name] = digest
                                  stamp = str(round((time.monotonic()-started)*1000))
                                  if name == 'daemon.log':
                                      (out / (stamp + '-' + name.replace('/', '-'))).write_bytes(raw)
                                  else:
                                      try:
                                          metadata = json.loads(raw)
                                          def redact(value):
                                              if isinstance(value, dict):
                                                  return {k: ('[REDACTED]' if any(term in k.lower() for term in ('token', 'secret', 'password', 'credential')) else redact(v)) for k, v in value.items()}
                                              if isinstance(value, list):
                                                  return [redact(v) for v in value]
                                              return value
                                          (out / (stamp + '-' + name.replace('/', '-'))).write_text(json.dumps(redact(metadata), indent=2))
                                      except Exception as e:
                                          event('metadata_parse_error', name=name, error=str(e))
                          except FileNotFoundError:
                              event('state_file_absent', name=name)
                          except Exception as e:
                              event('state_file_error', name=name, error=str(e))
                      stop.wait(0.2)
              except Exception as e:
                  event('observer_error', error=str(e))
              finally:
                  event('observer_end')

          command = ['node', '--experimental-strip-types', 'src/bin.ts', 'prepare', 'ios-runner', '--platform', 'ios', '--udid', sys.argv[1], '--timeout', os.environ['AGENT_DEVICE_IOS_PREPARE_TIMEOUT_MS'], '--json']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (out / 'launch.json').write_text(json.dumps(dict(sourceHead=head, cwd=os.getcwd(), command=command, stateDir=str(state), observer='read-only; sampling may perturb timing'), indent=2))
          with (out / 'preflight.stdout').open('wb') as stdout, (out / 'preflight.stderr').open('wb') as stderr:
              process = subprocess.Popen(command, stdout=stdout, stderr=stderr)
              event('preflight_spawn', pid=process.pid, command=command)
              observer = threading.Thread(target=observe, args=(process.pid,), daemon=True)
              observer.start()
              code = process.wait()
              event('preflight_exit', pid=process.pid, exitCode=code)
              stop.set()
              observer.join(timeout=3)
              for thread in samples:
                  thread.join(timeout=50)
          (out / 'exit-code.txt').write_text(str(code) + '\n')
          sys.stdout.buffer.write((out / 'preflight.stdout').read_bytes())
          sys.stderr.buffer.write((out / 'preflight.stderr').read_bytes())
          sys.exit(code if code >= 0 else 128-code)
          PYTHON

      - name: Run iOS simulator replay suite
        uses: ./.github/actions/run-gate
        with:
          gate: replay-ios
          args: |
            --udid
            ${{ steps.ios-simulator.outputs.simulator-udid }}
            --retries
            2
            --artifacts-dir
            test/artifacts/replays-ios-simulator
            --report-junit
            test/artifacts/replays-ios-simulator.junit.xml

      - name: Fetch current fixture app
        id: fixture-app
        uses: ./.github/actions/setup-fixture-app
        with:
          install: 'false'

      - name: Report fixture cache source
        run: |
          echo "Fixture app source: ${{ steps.fixture-app.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove selector drag reaches its destination on iOS
        run: |
          xcrun simctl install "${{ steps.ios-simulator.outputs.simulator-udid }}" "${{ steps.fixture-app.outputs.app-path }}"
          node --experimental-strip-types src/bin.ts replay examples/test-app/replays/drag.ad --platform ios --udid "${{ steps.ios-simulator.outputs.simulator-udid }}" --session nightly-ios-target-drag --json

      - name: Run full fixture-backed iOS simulator E2E
        env:
          AGENT_DEVICE_FIXTURE_APP_ID: ${{ steps.fixture-app.outputs.app-id }}
          AGENT_DEVICE_FIXTURE_APP_PATH: ${{ steps.fixture-app.outputs.app-path }}
          AGENT_DEVICE_IOS_E2E: '1'
          AGENT_DEVICE_IOS_E2E_TIER: full
          AGENT_DEVICE_IOS_UDID: ${{ steps.ios-simulator.outputs.simulator-udid }}
        run: |
          pnpm gate build
          node --experimental-strip-types scripts/node-test-tmpdir.ts --test test/integration/smoke-ios-simulator-coverage.test.ts test/integration/smoke-ios-simulator.test.ts

      - name: Run iOS physical device replay suite
        if: env.IOS_UDID != ''
        env:
          IOS_UDID: ${{ vars.IOS_UDID }}
        uses: ./.github/actions/run-gate
        with:
          gate: replay-ios-device
          args: |
            --udid
            ${{ env.IOS_UDID }}
            --retries
            2
            --artifacts-dir
            test/artifacts/replays-ios-device
            --report-junit
            test/artifacts/replays-ios-device.junit.xml

      - name: Upload iOS artifacts
        if: always()
        uses: ./.github/actions/upload-agent-device-artifacts
        with:
          artifact-name: replay-nightly-ios-artifacts
          agent-state-dir: ${{ env.AGENT_DEVICE_STATE_DIR }}
          runner-derived-path: ${{ env.AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH }}
