           p=pathlib.Path(td); records=p/'records';records.mkdir();wrapper=p/'adb';wrapper.write_bytes(proxy.read_bytes());wrapper.chmod(0o755);marker=p/'started';fake=p/'native';fake.write_text('#!/usr/bin/env python3\nimport pathlib,sys,time\npathlib.Path(sys.argv[1]).write_text("native")\ntime.sleep(float(sys.argv[2]))\n');fake.chmod(0o755)
