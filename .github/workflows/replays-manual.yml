name: PR3555 Targeted Native Evidence Round33
on:
  workflow_dispatch:
    inputs:
      deadline_utc:
        description: Fixed UTC measurement deadline, exactly 50 minutes after dispatch start
        required: true
        type: string
      dispatch_started_utc:
        description: Fixed UTC total-bound origin
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pr3555-native-round33-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-api36:
    name: PR3555 targeted native proof API 36
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_API: '36'
      EVIDENCE: ${{ github.workspace }}/.tmp/pr3555-round33-api36-evidence
      AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.tmp/pr3555-round33-api36-state
      AGENT_DEVICE_CLAIMS_DIR: ${{ github.workspace }}/.tmp/pr3555-round33-api36-claims
      OWNED_AVD_NAME: pr3555-round33-api36
      XDG_RUNTIME_DIR: ${{ runner.temp }}/pr3555-round33-api36-runtime
      MEASUREMENT_DEADLINE_UTC: ${{ inputs.deadline_utc }}
      MEASUREMENT_DISPATCH_UTC: ${{ inputs.dispatch_started_utc }}
    steps:
      - name: Checkout exact published PR3555 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 22dc288c6174048e78c7750aea1f46b3150fac3a
      - name: Validate fixed dispatch deadline
        shell: bash
        run: |
          python3 - <<'PYDEADLINE'
          import datetime,os
          deadline=datetime.datetime.fromisoformat(os.environ['MEASUREMENT_DEADLINE_UTC']);start=datetime.datetime.fromisoformat(os.environ['MEASUREMENT_DISPATCH_UTC']);assert deadline.utcoffset()==start.utcoffset()==datetime.timedelta(0);assert (deadline-start).total_seconds()==3000;assert datetime.datetime.now(datetime.timezone.utc)<deadline, 'allocation preparation arrived after fixed deadline'
          PYDEADLINE
      - name: Setup Node 24.13 and frozen dependencies
        uses: ./.github/actions/setup-node-pnpm
      - name: Setup isolated Android replay host
        uses: ./.github/actions/setup-android-replay-host
        with:
          package-helpers: 'true'
      - name: Prepare observer and independently validate forwarding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          cat > /tmp/review33-observer.cjs <<'REVIEW33_EOF'
          #!/usr/bin/env node
          'use strict';
